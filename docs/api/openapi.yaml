openapi: 3.0.3

# ─────────────────────────────────────────────────────────────────────────────
# Money Lover — canonical backend API contract (ADR-0017).
#
# This YAML is the HAND-MAINTAINED source of truth for the JSON API. It leads
# the implementation, not the other way around:
#   * webapp/ generates strict TypeScript types from this file (see
#     docs/api/package.json → `npm run generate`, output docs/api/generated/).
#   * backend/ asserts every live response + accepted params conform to it via
#     the RSpec conformance gate (committee-rails — see backend/README.md).
#
# How to extend it when adding an endpoint: see backend/README.md
# § "Extending the OpenAPI contract".
#
# Money is ALWAYS integer minor units (see schemas/MoneyMinorUnits). Never add
# a float/number money field — ADR-0015, PRD § "Money representation".
# ─────────────────────────────────────────────────────────────────────────────

info:
  title: Money Lover API
  version: 0.1.0
  description: >-
    Canonical Rails JSON API for Money Lover (ADR-0013). PostgreSQL is the
    source of truth; this contract describes the JSON-only HTTP surface that the
    web and iOS thin clients are built against. Money values are integer minor
    units everywhere — never floats (ADR-0015).

servers:
  - url: https://api.example.invalid
    description: Placeholder origin. Clients configure the real base URL per env.

# Default: every operation requires a bearer access token. Public operations
# (e.g. the health probe, future register/login) opt out with `security: []`.
security:
  - bearerAuth: []

tags:
  - name: System
    description: Operational probes and metadata.
  - name: Sources
    description: >-
      Money sources (CONTEXT.md): Accounts and Credit cards (a money balance) and
      Holdings (valued by quantity × market price). User-scoped CRUD returning
      each source's live current balance and base-currency valuation.
  - name: Transactions
    description: >-
      The ledger (CONTEXT.md): Expense, Income, Transfer, Invest and Adjustment
      rows, user-scoped. Balances are computed on read (opening + Σ
      transactions), so a row is the single source of its ledger deltas. A
      cross-currency Transfer carries a manual Rate and a computed Fee; a
      Backfill restates its source's opening balance atomically; an Invest Sell
      is blocked from overselling a Holding.
  - name: Envelopes
    description: >-
      Budgeting buckets (CONTEXT.md): named virtual Envelopes income is divided
      into, user-scoped. Each read returns the current month's spent and
      remaining (BudgetEngine). One Envelope is the Reserve (month-end leftovers
      accumulate there). Starter envelopes seed the list idempotently from a
      suggested set; an Allocation template seeds a month's per-Envelope
      allocations.
  - name: Auth
    description: >-
      Registration and the token lifecycle (ADR-0014). Clients obtain a
      short-lived JWT access token plus a long-lived rotating refresh token.
      Storage guidance: keep the refresh token in an httpOnly cookie (web) or
      the Keychain (iOS); keep the access token in memory only.
  - name: Rates
    description: >-
      Market rates used to value foreign-currency Accounts and Holdings in the
      base currency (CONTEXT.md "Rate"). Global values are auto-fetched and
      cached by the backend; a per-User override wins for that User's
      valuations only. Rate values are exact decimal strings in VND — never
      floats (ADR-0015).

  - name: Goals
    description: >-
      Savings Goals (CONTEXT.md): long-term targets with a funding window and a
      planned Schedule, user-scoped. A read returns the Goal's live balance (Σ
      Contributions) and the GoalTracker numbers — Expected-by-today, ahead/delay
      progress, and per-line Schedule status + shortfall. A Contribution funds a
      Goal from a VND Account, recorded atomically as a Transfer so net worth is
      unchanged (one Asset becomes another).
paths:
  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Register a password identity
      description: >-
        Create a new User with a `password` Identity and immediately return a
        token pair (auto-login). Public (no auth).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created; returns the initial token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Log in with a password identity
      description: >-
        Exchange username + password for an access token and a refresh token.
        Public (no auth).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credentials accepted; returns a token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /auth/refresh:
    post:
      operationId: refresh
      tags: [Auth]
      summary: Rotate the refresh token
      description: >-
        Revoke the presented refresh token and return a brand-new pair. Reusing
        a rotated or revoked refresh token fails with 401. Public (no auth) — the
        refresh token itself is the credential.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh token rotated; returns a new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke a refresh token
      description: >-
        Revoke the refresh token so the device can no longer obtain new access
        tokens. Idempotent. Public (no auth) — the refresh token is the
        credential.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Refresh token revoked (or already inactive).
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/sources:
    get:
      operationId: listSources
      tags: [Sources]
      summary: List the caller's money sources
      description: >-
        Returns every source owned by the authenticated user, each with its live
        current balance and base-currency (VND) valuation.
      responses:
        "200":
          description: The caller's sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    post:
      operationId: createSource
      tags: [Sources]
      summary: Create a money source
      description: >-
        Create an Account, Credit card, or Holding. Account/Credit card require a
        currency and opening balance (integer minor units). A Holding requires an
        opening quantity and unit; a stock (shares) also requires a HOSE ticker, a
        gold Holding (chỉ/lượng) must not carry one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceCreateRequest"
      responses:
        "201":
          description: Source created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/sources/{id}:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    get:
      operationId: getSource
      tags: [Sources]
      summary: Read one money source
      description: Returns a single source with its current balance and valuation.
      responses:
        "200":
          description: The requested source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    patch:
      operationId: updateSource
      tags: [Sources]
      summary: Update a money source
      description: >-
        Partially update a source's name, icon, logo, currency, opening balance,
        or (for a Holding) opening quantity / unit / ticker. `kind` is immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceUpdateRequest"
      responses:
        "200":
          description: Source updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      operationId: deleteSource
      tags: [Sources]
      summary: Delete a money source
      description: >-
        Delete a source. Blocked with 409 when transactions still reference it
        (delete integrity), so ledger rows are never orphaned.
      responses:
        "204":
          description: Source deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /api/transactions:
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: List the caller's transactions
      description: >-
        Returns the caller's transactions, newest first. Optional filters narrow
        by date range (occurred_on), source (matching either leg of a transfer),
        envelope, and kind.
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on occurred_on (ISO date).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Inclusive upper bound on occurred_on (ISO date).
          schema:
            type: string
            format: date
        - name: source_id
          in: query
          required: false
          description: Only transactions whose source or destination is this source.
          schema:
            type: integer
            format: int64
        - name: envelope_id
          in: query
          required: false
          description: Only transactions assigned to this envelope.
          schema:
            type: integer
            format: int64
        - name: kind
          in: query
          required: false
          description: Only transactions of this kind.
          schema:
            type: string
            enum: [expense, income, transfer, invest, adjustment]
      responses:
        "200":
          description: The caller's transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    post:
      operationId: createTransaction
      tags: [Transactions]
      summary: Create a transaction
      description: >-
        Create an Expense, Income, Transfer, Invest or Adjustment. Required
        fields differ by kind. A cross-currency Transfer must carry a
        destination amount and a manual Rate (the Fee is computed). An Invest
        moves money between a VND Account and a Holding; a Sell that would
        oversell the Holding is rejected. A `backfill` flag restates the source's
        opening balance atomically so the current balance is unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreateRequest"
      responses:
        "201":
          description: Transaction created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    get:
      operationId: getTransaction
      tags: [Transactions]
      summary: Read one transaction
      description: Returns a single transaction owned by the caller.
      responses:
        "200":
          description: The requested transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    patch:
      operationId: updateTransaction
      tags: [Transactions]
      summary: Update a transaction
      description: >-
        Partially update a transaction's amount, note, date, envelope/goal
        reference, trade quantity, or cross-currency amount/rate. `kind`,
        `source_id` and `destination_id` are immutable. The Fee is re-derived and
        the oversell guard re-checked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdateRequest"
      responses:
        "200":
          description: Transaction updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      operationId: deleteTransaction
      tags: [Transactions]
      summary: Delete a transaction
      description: >-
        Delete a transaction. Affected source balances are recomputed on the next
        read (opening + Σ remaining transactions).
      responses:
        "204":
          description: Transaction deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /api/envelopes:
    get:
      operationId: listEnvelopes
      tags: [Envelopes]
      summary: List the caller's envelopes
      description: >-
        Returns every Envelope owned by the authenticated user, each with the
        current month's allocation, spent and remaining (BudgetEngine).
      responses:
        "200":
          description: The caller's envelopes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    post:
      operationId: createEnvelope
      tags: [Envelopes]
      summary: Create an envelope
      description: >-
        Create a named Envelope with an optional icon, monthly Allocation,
        optional weekly/monthly caps, and an optional Reserve flag. At most one
        Reserve may exist per user; setting a second is rejected with 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvelopeCreateRequest"
      responses:
        "201":
          description: Envelope created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/envelopes/{id}:
    parameters:
      - $ref: "#/components/parameters/EnvelopeId"
    get:
      operationId: getEnvelope
      tags: [Envelopes]
      summary: Read one envelope
      description: Returns a single Envelope with its current-month spent and remaining.
      responses:
        "200":
          description: The requested envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    patch:
      operationId: updateEnvelope
      tags: [Envelopes]
      summary: Update an envelope
      description: >-
        Partially update an Envelope's name, icon, Allocation, caps, currency, or
        Reserve flag. Setting the Reserve flag when another Reserve exists is
        rejected with 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvelopeUpdateRequest"
      responses:
        "200":
          description: Envelope updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      operationId: deleteEnvelope
      tags: [Envelopes]
      summary: Delete an envelope
      responses:
        "204":
          description: Envelope deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /api/starter_envelopes:
    post:
      operationId: seedStarterEnvelopes
      tags: [Envelopes]
      summary: Seed the starter envelopes
      description: >-
        Populate the caller's Envelope list from the single suggested set
        (name + icon, Allocation ₫0). Idempotent on existing names
        (case-insensitive, trimmed); designates the Reserve only when the caller
        has none. Returns the resulting Envelope list.
      responses:
        "201":
          description: Starter set applied; returns the caller's envelopes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/allocation_template:
    post:
      operationId: applyAllocationTemplate
      tags: [Envelopes]
      summary: Save and apply the allocation template to a month
      description: >-
        Save the template (each Envelope's default Allocation) and seed a month's
        per-Envelope Allocation snapshots from it. With no `allocations`, seeds
        the month from the existing defaults; with no `month`, targets the
        caller's current month. Returns the Envelope list for the applied month.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationTemplateRequest"
      responses:
        "201":
          description: Template applied; returns the envelopes for the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/reconciliations:
    post:
      operationId: createReconciliation
      tags: [Transactions]
      summary: Reconcile sources against their real balances
      description: >-
        Submit each money source's re-entered real balance. The server compares
        it to the source's Current balance (opening + Σ transactions) and writes
        one signed Adjustment transaction per source that drifted, atomically
        (all-or-nothing). A source already on the money produces no Adjustment.
        Returns the created Adjustments and the ids of the unchanged sources as
        an auditable Reconciliation record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconciliationCreateRequest"
      responses:
        "201":
          description: Reconciliation completed; Adjustments written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reconciliation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/goals:
    get:
      operationId: listGoals
      tags: [Goals]
      summary: List the caller's goals
      description: >-
        Returns every Goal owned by the authenticated user, each with its live
        balance (Σ Contributions) and GoalTracker progress, Schedule status and
        per-line shortfall.
      responses:
        "200":
          description: The caller's goals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    post:
      operationId: createGoal
      tags: [Goals]
      summary: Create a goal
      description: >-
        Create a savings Goal with a name, a positive target (integer minor
        units), an optional funding window (start/end month), and a Schedule of
        month → planned amount. VND-only for now.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalCreateRequest"
      responses:
        "201":
          description: Goal created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/goals/{id}:
    parameters:
      - $ref: "#/components/parameters/GoalId"
    get:
      operationId: getGoal
      tags: [Goals]
      summary: Read one goal
      description: >-
        Returns a single Goal with its balance, progress, and per-line Schedule
        status + shortfall.
      responses:
        "200":
          description: The requested goal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
    patch:
      operationId: updateGoal
      tags: [Goals]
      summary: Update a goal
      description: >-
        Partially update a Goal's name, icon, target, funding window, or Schedule.
        `currency` is immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdateRequest"
      responses:
        "200":
          description: Goal updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      operationId: deleteGoal
      tags: [Goals]
      summary: Delete a goal
      description: Delete a Goal. Its Contribution transfers remain in the ledger.
      responses:
        "204":
          description: Goal deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /api/goals/{goal_id}/contributions:
    parameters:
      - name: goal_id
        in: path
        required: true
        description: The goal's id.
        schema:
          type: integer
          format: int64
    post:
      operationId: createContribution
      tags: [Goals]
      summary: Contribute to a goal
      description: >-
        Fund the Goal from a VND Account. Recorded as a single Transfer (the
        Account is debited, the Goal credited by the same amount) committed
        atomically, so net worth is unchanged. The source must be a VND Account;
        foreign-currency funding is rejected. Returns the updated Goal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionCreateRequest"
      responses:
        "201":
          description: Contribution recorded; returns the updated Goal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Health probe
      description: >-
        Returns `{ "status": "ok" }` when the app has booted. Public (no auth).
        Described here so the contract covers a real, conformance-tested
        endpoint from day one.
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /rates:
    get:
      operationId: listRates
      tags: [Rates]
      summary: List resolved rates for the current user
      description: >-
        Every rate resolved for the caller: a per-User override wins, otherwise
        the global cached value. A value flagged `stale: true` is the last good
        cached value after a failed upstream fetch.
      responses:
        "200":
          description: The caller's resolved rates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /rates/{key}/override:
    parameters:
      - name: key
        in: path
        required: true
        description: 'Rate key, e.g. `fx.USD`, `gold`, or `stock.VNM`.'
        schema:
          type: string
        example: fx.USD
    put:
      operationId: setRateOverride
      tags: [Rates]
      summary: Set the current user's override for a rate
      description: >-
        Create or replace the caller's manual override for `key`. The override
        affects only this User's valuations. Returns the resolved rate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateOverrideRequest"
      responses:
        "200":
          description: Override stored; returns the resolved rate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      operationId: clearRateOverride
      tags: [Rates]
      summary: Clear the current user's override for a rate
      description: >-
        Remove the caller's override for `key` so their valuations fall back to
        the global cached value. Idempotent.
      responses:
        "204":
          description: Override removed (or none existed).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

components:
  securitySchemes:
    # Short-lived JWT access token (ADR-0014). Sent as `Authorization: Bearer …`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GoalId:
      name: id
      in: path
      required: true
      description: The goal's id.
      schema:
        type: integer
        format: int64
    SourceId:
      name: id
      in: path
      required: true
      description: The money source's id.
      schema:
        type: integer
        format: int64
    TransactionId:
      name: id
      in: path
      required: true
      description: The transaction's id.
      schema:
        type: integer
        format: int64
    EnvelopeId:
      name: id
      in: path
      required: true
      description: The envelope's id.
      schema:
        type: integer
        format: int64

  schemas:
    # Integer minor units only — the single money representation for the whole
    # API. `amount_minor` is the signed amount in the currency's smallest
    # indivisible unit (e.g. VND has no minor unit → 12 345 means ₫12,345;
    # a 2-dp currency would carry cents). NEVER model money as `number`.
    MoneyMinorUnits:
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Signed amount in the currency's smallest indivisible unit.
          example: 12345
        currency:
          type: string
          description: ISO 4217 alphabetic code.
          example: VND
          minLength: 3
          maxLength: 3

    # Structured error envelope returned for 4xx/5xx — mirrors
    # app/controllers/concerns/error_handling.rb: { error: { code, message, details? } }.
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              example: validation_failed
            message:
              type: string
              description: Human-readable explanation. Not for control flow.
            details:
              description: >-
                Optional machine-readable detail (e.g. per-field validation
                errors). Free-form and endpoint-specific; the key is absent
                (not null) when not applicable.

    # ── Auth (ADR-0014) ──────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          description: The external id of the new password Identity.
          example: alice
        password:
          type: string
          format: password
          description: Plaintext password; stored only as a bcrypt digest.
          example: secret123
        timezone:
          type: string
          description: >-
            IANA timezone for month boundaries / resets / "today". Defaults to
            Asia/Ho_Chi_Minh when omitted.
          example: Asia/Ho_Chi_Minh

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          example: alice
        password:
          type: string
          format: password
          example: secret123

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: The opaque refresh token to rotate (refresh) or revoke (logout).

    # Access token + rotating refresh token (ADR-0014). Returned by register,
    # login, and refresh.
    TokenPair:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: "Short-lived JWT. Send as `Authorization: Bearer <token>`."
        refresh_token:
          type: string
          description: Long-lived opaque token; rotates on each use.
        token_type:
          type: string
          enum: [Bearer]
          description: Always "Bearer".
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
          example: 900

    # Reusable pagination envelope for future list endpoints.
    Pagination:
      type: object
      additionalProperties: false
      required: [page, per_page, total_count, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
          description: 1-based current page.
        per_page:
          type: integer
          minimum: 1
          description: Items per page.
        total_count:
          type: integer
          minimum: 0
          description: Total items across all pages.
        total_pages:
          type: integer
          minimum: 0
          description: Total number of pages.

    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: Literal "ok" when the service is healthy.

    # ── Sources (issue 13, CONTEXT.md) ───────────────────────────────────────
    # A money source: an Account or Credit card (a money balance) or a Holding
    # (valued by quantity × market price). `opening_balance` is present only for
    # money sources; `holding` only for Holdings.
    Source:
      type: object
      additionalProperties: false
      required: [id, kind, name, currency, current_balance, valuation]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [account, credit_card, holding]
          description: account | credit_card | holding (CONTEXT.md).
        name:
          type: string
        icon:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
          description: Optional logo asset reference.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code. VND for Holdings (the base currency).
          example: VND
        opening_balance:
          allOf:
            - $ref: "#/components/schemas/MoneyMinorUnits"
          description: >-
            The opening money balance. Present for account/credit_card; omitted
            for a holding (which has no opening money balance).
        holding:
          type: object
          additionalProperties: false
          required: [opening_quantity, unit]
          description: Holding-specific facts; present only when kind is holding.
          properties:
            opening_quantity:
              type: string
              description: Exact decimal quantity (never a float — ADR-0015).
              example: "3"
            unit:
              type: string
              enum: [chi, luong, shares]
            ticker:
              type: string
              nullable: true
              description: HOSE ticker for a stock holding; null for gold.
        current_balance:
          $ref: "#/components/schemas/MoneyMinorUnits"
        valuation:
          allOf:
            - $ref: "#/components/schemas/MoneyMinorUnits"
          description: Value in the base currency (VND).

    SourceList:
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"

    SourceCreateRequest:
      type: object
      additionalProperties: false
      required: [kind, name]
      description: >-
        Account/Credit card require currency + opening_minor_units. Holding
        requires opening_quantity + unit (and a ticker for shares).
      properties:
        kind:
          type: string
          enum: [account, credit_card, holding]
        name:
          type: string
          example: VPBank
        icon:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: VND
        opening_minor_units:
          type: integer
          format: int64
          description: Opening balance in minor units (account/credit_card).
          example: 1000000
        opening_quantity:
          type: string
          description: Opening quantity for a holding, as an exact decimal string.
          example: "3"
        unit:
          type: string
          enum: [chi, luong, shares]
        ticker:
          type: string
          nullable: true

    SourceUpdateRequest:
      type: object
      additionalProperties: false
      description: Partial update. `kind` is immutable and not accepted.
      properties:
        name:
          type: string
        icon:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
        currency:
          type: string
          minLength: 3
          maxLength: 3
        opening_minor_units:
          type: integer
          format: int64
        opening_quantity:
          type: string
        unit:
          type: string
          enum: [chi, luong, shares]
        ticker:
          type: string
          nullable: true

    # ── Transactions (issue 14, CONTEXT.md) ──────────────────────────────────
    # A ledger row. `amount` is in the source currency (a signed reconcile delta
    # for an adjustment). Kind-specific fields appear only when relevant:
    # destination_id (transfer/invest), destination_amount + fee + manual_rate
    # (cross-currency transfer), trade_quantity + trade_direction (invest).
    Transaction:
      type: object
      additionalProperties: false
      required: [id, kind, source_id, amount, occurred_on, backfill]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [expense, income, transfer, invest, adjustment]
        source_id:
          type: integer
          format: int64
          description: The source the money primarily leaves/affects.
        destination_id:
          type: integer
          format: int64
          description: The receiving source (transfer) or Holding (invest).
        amount:
          $ref: "#/components/schemas/MoneyMinorUnits"
        destination_amount:
          allOf:
            - $ref: "#/components/schemas/MoneyMinorUnits"
          description: >-
            Amount that lands in the destination of a cross-currency transfer,
            in the destination currency. Omitted otherwise.
        fee:
          allOf:
            - $ref: "#/components/schemas/MoneyMinorUnits"
          description: >-
            Computed Fee of a cross-currency transfer (= amount_out × rate −
            amount_in), in the destination currency. Omitted otherwise.
        manual_rate:
          type: string
          description: >-
            Manually-entered Rate for a cross-currency transfer (destination
            major units per source major unit), as an exact decimal string.
        trade_quantity:
          type: string
          description: Exact units transacted for an invest (never a float).
        trade_direction:
          type: string
          enum: [buy, sell]
          description: Invest direction.
        envelope_id:
          type: integer
          format: int64
          description: Envelope assignment (expense/adjustment).
        goal_id:
          type: integer
          format: int64
          description: Goal reference (a contribution transfer).
        note:
          type: string
        occurred_on:
          type: string
          format: date
          description: The date the money moved.
        backfill:
          type: boolean
          description: >-
            True when logged as a Backfill (its source's opening balance was
            restated so the current balance stayed unchanged).

    TransactionList:
      type: object
      additionalProperties: false
      required: [transactions]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"

    TransactionCreateRequest:
      type: object
      additionalProperties: false
      required: [kind, source_id]
      description: >-
        Required fields differ by kind. All kinds need amount_minor_units +
        currency. Transfer/invest need destination_id; a cross-currency transfer
        also needs destination_amount_minor_units + manual_rate; an invest needs
        trade_quantity + trade_direction (and VND currency).
      properties:
        kind:
          type: string
          enum: [expense, income, transfer, invest, adjustment]
        source_id:
          type: integer
          format: int64
        destination_id:
          type: integer
          format: int64
        amount_minor_units:
          type: integer
          format: int64
          description: Amount in the source currency's minor units (signed for adjustment).
        currency:
          type: string
          minLength: 3
          maxLength: 3
        destination_amount_minor_units:
          type: integer
          format: int64
        destination_currency:
          type: string
          minLength: 3
          maxLength: 3
        manual_rate:
          type: string
          description: Exact decimal string (no float).
        trade_quantity:
          type: string
          description: Exact decimal string (no float).
        trade_direction:
          type: string
          enum: [buy, sell]
        envelope_id:
          type: integer
          format: int64
        goal_id:
          type: integer
          format: int64
        note:
          type: string
          nullable: true
        occurred_on:
          type: string
          format: date
          description: Defaults to today when omitted.
        backfill:
          type: boolean
          description: Restate the source opening balance so current balance is unchanged.

    TransactionUpdateRequest:
      type: object
      additionalProperties: false
      description: >-
        Partial update. `kind`, `source_id` and `destination_id` are immutable.
      properties:
        amount_minor_units:
          type: integer
          format: int64
        destination_amount_minor_units:
          type: integer
          format: int64
        manual_rate:
          type: string
        trade_quantity:
          type: string
        envelope_id:
          type: integer
          format: int64
        goal_id:
          type: integer
          format: int64
        note:
          type: string
          nullable: true
        occurred_on:
          type: string
          format: date

    # ── Envelopes (issue 15, CONTEXT.md) ─────────────────────────────────────
    # A budgeting Envelope. `allocation` is the effective Allocation for the
    # reported month (the per-month snapshot, else the Envelope default);
    # `spent`/`remaining` are computed for the month by BudgetEngine. Caps
    # (weekly_cap/monthly_cap) appear only when set.
    Envelope:
      type: object
      additionalProperties: false
      required: [id, name, is_reserve, currency, allocation, carried, spent, remaining]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        icon:
          type: string
          nullable: true
        is_reserve:
          type: boolean
          description: True for the single Reserve Envelope (CONTEXT.md "Reserve").
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: VND
        allocation:
          allOf:
            - $ref: "#/components/schemas/MoneyMinorUnits"
          description: The effective Allocation for the reported month.
        carried:
          allOf:
            - $ref: "#/components/schemas/MoneyMinorUnits"
          description: Accumulated carry (Reserve balance or roll-over).
        spent:
          allOf:
            - $ref: "#/components/schemas/MoneyMinorUnits"
          description: Σ of the month's Expenses assigned to this Envelope.
        remaining:
          allOf:
            - $ref: "#/components/schemas/MoneyMinorUnits"
          description: allocation + carried − spent (negative when overspent).
        weekly_cap:
          allOf:
            - $ref: "#/components/schemas/MoneyMinorUnits"
          description: Optional weekly spending cap; omitted when unset.
        monthly_cap:
          allOf:
            - $ref: "#/components/schemas/MoneyMinorUnits"
          description: Optional monthly spending cap; omitted when unset.

    EnvelopeList:
      type: object
      additionalProperties: false
      required: [envelopes]
      properties:
        envelopes:
          type: array
          items:
            $ref: "#/components/schemas/Envelope"

    EnvelopeCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          example: Food
        icon:
          type: string
          nullable: true
        is_reserve:
          type: boolean
          description: Mark this Envelope as the Reserve (at most one per user).
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: Defaults to VND when omitted.
          example: VND
        allocation_minor_units:
          type: integer
          format: int64
          minimum: 0
          description: Default monthly Allocation in minor units (defaults to 0).
        weekly_cap_minor_units:
          type: integer
          format: int64
          minimum: 0
        monthly_cap_minor_units:
          type: integer
          format: int64
          minimum: 0

    EnvelopeUpdateRequest:
      type: object
      additionalProperties: false
      description: Partial update; every field is optional.
      properties:
        name:
          type: string
        icon:
          type: string
          nullable: true
        is_reserve:
          type: boolean
        currency:
          type: string
          minLength: 3
          maxLength: 3
        allocation_minor_units:
          type: integer
          format: int64
          minimum: 0
        weekly_cap_minor_units:
          type: integer
          format: int64
          minimum: 0
        monthly_cap_minor_units:
          type: integer
          format: int64
          minimum: 0

    AllocationTemplateRequest:
      type: object
      additionalProperties: false
      description: >-
        Save the template and apply it to a month. `month` defaults to the
        caller's current month; `allocations` defaults to the existing
        per-Envelope defaults.
      properties:
        month:
          type: string
          description: Target month as YYYY-MM or a full ISO date (the day is ignored).
          example: "2026-06"
        allocations:
          type: array
          description: Per-Envelope Allocation amounts to save and apply.
          items:
            $ref: "#/components/schemas/AllocationTemplateLine"

    AllocationTemplateLine:
      type: object
      additionalProperties: false
      required: [envelope_id, amount_minor_units]
      properties:
        envelope_id:
          type: integer
          format: int64
        amount_minor_units:
          type: integer
          format: int64
          minimum: 0

    # ── Rates (issue 19) ─────────────────────────────────────────────────────
    # One rate resolved for the current user. `value` is an exact decimal STRING
    # in VND — never a JSON number — so no precision is lost (ADR-0015):
    #   fx.<CUR>       VND per 1 major unit of the foreign currency
    #   gold           VND per chỉ of SJC gold
    #   stock.<TICKER> VND per share
    RateEntry:
      type: object
      additionalProperties: false
      required: [key, value, stale, overridden]
      properties:
        key:
          type: string
          description: Namespaced rate key (fx.USD, gold, stock.VNM).
          example: fx.USD
        value:
          type: string
          description: Exact decimal VND amount as a string (never a float).
          example: "25500"
        source:
          type: string
          nullable: true
          description: >-
            Upstream provenance of the global value (e.g. "fx", "sjc", "hose").
            Null when only a User override exists for the key.
          example: fx
        fetched_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the global value was last successfully fetched. Null when only
            a User override exists for the key.
        stale:
          type: boolean
          description: >-
            True when the global value is the last good cache after a failed
            upstream fetch.
        overridden:
          type: boolean
          description: True when this value comes from the caller's manual override.

    RatesResponse:
      type: object
      additionalProperties: false
      required: [rates]
      properties:
        rates:
          type: array
          items:
            $ref: "#/components/schemas/RateEntry"

    RateOverrideRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          description: >-
            Exact, non-negative decimal VND amount as a string (never a float —
            ADR-0015). Same units as the rate key it overrides.
          example: "26000"

    # ── Reconcile (issue 17, CONTEXT.md "Reconcile"/"Adjustment") ─────────────
    # One source's re-entered real balance. The drift from its Current balance
    # becomes a signed Adjustment; an equal balance produces none.
    ReconciliationBalance:
      type: object
      additionalProperties: false
      required: [source_id, amount_minor_units, currency]
      properties:
        source_id:
          type: integer
          format: int64
          description: A money source (account/credit_card) owned by the caller.
        amount_minor_units:
          type: integer
          format: int64
          description: The re-entered real balance in the source currency's minor units.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: Must match the source's currency.
        envelope_id:
          type: integer
          format: int64
          description: Optional Envelope assignment for the Adjustment.
        note:
          type: string
          nullable: true
          description: Optional description for the Adjustment.

    ReconciliationCreateRequest:
      type: object
      additionalProperties: false
      required: [balances]
      properties:
        balances:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReconciliationBalance"

    # The auditable result of a Reconcile action: the Adjustment transactions it
    # created (full Transaction shape) plus the ids of the sources that were
    # already correct (no Adjustment needed).
    Reconciliation:
      type: object
      additionalProperties: false
      required: [adjustments, unchanged_source_ids]
      properties:
        adjustments:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        unchanged_source_ids:
          type: array
          items:
            type: integer
            format: int64

    # ── Goals (issue 16, CONTEXT.md) ─────────────────────────────────────────
    # A (year, month) coordinate — Contributions are month-based, not day-based.
    GoalMonth:
      type: object
      additionalProperties: false
      required: [year, month]
      properties:
        year:
          type: integer
          example: 2026
        month:
          type: integer
          minimum: 1
          maximum: 12
          example: 1

    # One Schedule line as read: the planned amount for a month plus its
    # cumulative status and shortfall (GoalTracker). Contributions fill lines
    # oldest-first; `status` is funded | due | missed | pending, and `shortfall`
    # is the scheduled amount minus the Contributions allocated to that line.
    GoalScheduleLine:
      type: object
      additionalProperties: false
      required: [year, month, planned, status, shortfall]
      properties:
        year:
          type: integer
          example: 2026
        month:
          type: integer
          minimum: 1
          maximum: 12
          example: 1
        planned:
          $ref: "#/components/schemas/MoneyMinorUnits"
        status:
          type: string
          enum: [funded, due, missed, pending]
          description: Cumulative Schedule-line status (CONTEXT.md).
        shortfall:
          allOf:
            - $ref: "#/components/schemas/MoneyMinorUnits"
          description: Scheduled amount minus the Contributions allocated to this line.

    # The Goal's progress at "today" (in the User's timezone). `expected` is the
    # Expected-by-today cumulative Schedule amount; `pct` is the exact ahead/delay
    # ratio (actual ÷ expected − 1) as a decimal STRING, null until something is
    # due; `pct_sign` is its sign.
    GoalProgress:
      type: object
      additionalProperties: false
      required: [expected, pct_sign]
      properties:
        expected:
          $ref: "#/components/schemas/MoneyMinorUnits"
        pct:
          type: string
          nullable: true
          description: >-
            Exact ahead/delay ratio as a decimal string (never a float). Null
            when nothing is due yet (no defined ratio).
          example: "0.25"
        pct_sign:
          type: string
          enum: [positive, negative, zero]
          description: Whether the Goal is ahead of, behind, or exactly on plan.

    # A savings Goal with its derived balance + GoalTracker numbers. `balance` is
    # the sum of its Contributions (an Asset); `target` and every Schedule amount
    # are integer minor units. `start_month` / `end_month` describe the funding
    # window when set.
    Goal:
      type: object
      additionalProperties: false
      required: [id, name, currency, target, balance, schedule, progress]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: House
        icon:
          type: string
          nullable: true
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code. VND only for now.
          example: VND
        target:
          $ref: "#/components/schemas/MoneyMinorUnits"
        start_month:
          $ref: "#/components/schemas/GoalMonth"
        end_month:
          $ref: "#/components/schemas/GoalMonth"
        balance:
          allOf:
            - $ref: "#/components/schemas/MoneyMinorUnits"
          description: The accumulated Contributions (CONTEXT.md "Goal" balance).
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/GoalScheduleLine"
        progress:
          $ref: "#/components/schemas/GoalProgress"

    GoalList:
      type: object
      additionalProperties: false
      required: [goals]
      properties:
        goals:
          type: array
          items:
            $ref: "#/components/schemas/Goal"

    # One planned Schedule line on input: a month and its planned amount.
    GoalScheduleInput:
      type: object
      additionalProperties: false
      required: [year, month, amount_minor_units]
      properties:
        year:
          type: integer
          example: 2026
        month:
          type: integer
          minimum: 1
          maximum: 12
          example: 1
        amount_minor_units:
          type: integer
          format: int64
          description: Planned amount in minor units (positive).
          example: 100000000

    GoalCreateRequest:
      type: object
      additionalProperties: false
      required: [name, target_minor_units, schedule]
      description: VND-only. A positive target and a Schedule of month → planned amount.
      properties:
        name:
          type: string
          example: House
        icon:
          type: string
          nullable: true
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: VND only for now; defaults to VND when omitted.
          example: VND
        target_minor_units:
          type: integer
          format: int64
          example: 400000000
        start_month:
          $ref: "#/components/schemas/GoalMonth"
        end_month:
          $ref: "#/components/schemas/GoalMonth"
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/GoalScheduleInput"

    GoalUpdateRequest:
      type: object
      additionalProperties: false
      description: Partial update. `currency` is immutable and not accepted.
      properties:
        name:
          type: string
        icon:
          type: string
          nullable: true
        target_minor_units:
          type: integer
          format: int64
        start_month:
          $ref: "#/components/schemas/GoalMonth"
        end_month:
          $ref: "#/components/schemas/GoalMonth"
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/GoalScheduleInput"

    # Fund a Goal from a VND Account (CONTEXT.md "Contribution"). VND-only; the
    # amount is positive minor units.
    ContributionCreateRequest:
      type: object
      additionalProperties: false
      required: [source_id, amount_minor_units]
      properties:
        source_id:
          type: integer
          format: int64
          description: The VND Account to fund from.
        amount_minor_units:
          type: integer
          format: int64
          description: Positive amount in minor units.
          example: 40000000
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: VND only; defaults to VND when omitted.
          example: VND
        occurred_on:
          type: string
          format: date
          description: The date the money moved. Defaults to today when omitted.
        note:
          type: string
          nullable: true

  responses:
    NotAcceptable:
      description: The `Accept` header does not allow `application/json`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The request body is not `application/json`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer access token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist or is not owned by the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Param validation failed (dry-validation contract).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the resource's current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
