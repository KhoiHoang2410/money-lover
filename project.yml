name: MoneyLover
options:
  bundleIdPrefix: com.hnkhoi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "JD97B9V8P3"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "20"
    MARKETING_VERSION: "0.15.0"
targets:
  MoneyLover:
    type: application
    platform: iOS
    sources:
      - path: MoneyLover
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hnkhoi.moneylover
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  MoneyLoverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoneyLoverTests
    dependencies:
      - target: MoneyLover
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MoneyLoverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MoneyLoverUITests
        excludes:
          - "README.md"
      # Shared accessibility identifiers, compiled into the test bundle too so tests and views
      # reference the same constants (no magic strings).
      - path: MoneyLover/App/AccessibilityID.swift
    dependencies:
      - target: MoneyLover
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MoneyLover
schemes:
  MoneyLover:
    build:
      targets:
        MoneyLover: all
        MoneyLoverTests: [test]
        MoneyLoverUITests: [test]
    test:
      # Two tiers (ADR-0011): Smoke is the curated PR gate, Full is the nightly
      # regression. Both are committed .xctestplan files — the single source of
      # truth for which tests run, usable here and locally in Xcode (⌘U → plan).
      testPlans:
        - path: Full.xctestplan
          defaultPlan: true
        - path: Smoke.xctestplan
      targets:
        - MoneyLoverTests
        - MoneyLoverUITests
