name: MoneyLover
options:
  bundleIdPrefix: com.hnkhoi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "JD97B9V8P3"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "9"
    MARKETING_VERSION: "0.4.1"
targets:
  MoneyLover:
    type: application
    platform: iOS
    sources:
      - path: MoneyLover
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hnkhoi.moneylover
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Money Lover uses the microphone to capture a spoken expense for you to review before saving."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Money Lover transcribes your spoken expense on-device so you can review and save it."
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  MoneyLoverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoneyLoverTests
    dependencies:
      - target: MoneyLover
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MoneyLoverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MoneyLoverUITests
        excludes:
          - "README.md"
      # Shared accessibility identifiers, compiled into the test bundle too so tests and views
      # reference the same constants (no magic strings).
      - path: MoneyLover/App/AccessibilityID.swift
    dependencies:
      - target: MoneyLover
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MoneyLover
schemes:
  MoneyLover:
    build:
      targets:
        MoneyLover: all
        MoneyLoverTests: [test]
        MoneyLoverUITests: [test]
    test:
      targets:
        - MoneyLoverTests
        - MoneyLoverUITests
