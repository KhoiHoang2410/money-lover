name: MoneyLover
options:
  bundleIdPrefix: com.hnkhoi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "REPLACE_WITH_TEAM_ID"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  MoneyLover:
    type: application
    platform: iOS
    sources:
      - path: MoneyLover
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hnkhoi.moneylover
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Money Lover uses the microphone to capture a spoken expense for you to review before saving."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Money Lover transcribes your spoken expense on-device so you can review and save it."
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  MoneyLoverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoneyLoverTests
    dependencies:
      - target: MoneyLover
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MoneyLover:
    build:
      targets:
        MoneyLover: all
        MoneyLoverTests: [test]
    test:
      targets:
        - MoneyLoverTests
