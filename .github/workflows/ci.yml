name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN for all jobs: this workflow only checks out
# code and uploads/downloads artifacts (artifact actions need no extra scope).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: MoneyLover
  PROJECT: MoneyLover.xcodeproj
  # iPhone 17 on the latest installed iOS runtime (see README.md).
  DESTINATION: "platform=iOS Simulator,name=iPhone 17,OS=latest"

jobs:
  # 0. Detect whether this push/PR touches anything that ships in (or builds)
  #    the app. If only docs / .claude skills / repo config changed, the binary
  #    is byte-for-byte identical, so build + tests are skipped below.
  #
  #    IMPORTANT — why skip at the *job* level (if:) and not via `on: paths`:
  #    build/unit-tests/ui-smoke are *required* status checks (main ruleset).
  #    A `paths-ignore` filter would make the whole workflow not run, leaving
  #    those required checks "Expected — waiting" forever and wedging the PR.
  #    A job skipped by an `if:` condition instead reports a "skipped"
  #    conclusion, which GitHub counts as a *pass* for required checks. So the
  #    workflow always triggers; this cheap Ubuntu job decides the rest.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      backend: ${{ steps.filter.outputs.backend }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect app / test code changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Pick the diff base. PR: the base branch tip. Push: the previous tip.
          # Manual dispatch / first push (all-zero before): no base → run everything.
          if [ "$EVENT" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ "$EVENT" = "push" ] && [ "${BEFORE_SHA:-}" != "0000000000000000000000000000000000000000" ]; then
            base="${BEFORE_SHA:-}"
          else
            base=""
          fi

          if [ -z "$base" ]; then
            echo "No diff base (manual/initial run) — running full CI."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"
          echo "$changed"

          # Path filters (ADR-0016 monorepo): the iOS pipeline runs only on
          # ios/** changes, the backend pipeline only on backend/** changes.
          # Everything iOS (sources, tests, project.yml, test plans) lives under
          # ios/. Editing this CI file itself does NOT trigger either pipeline.
          if echo "$changed" | grep -Eq '^ios/'; then
            echo "iOS changes detected → running iOS build + tests."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "No iOS changes → skipping iOS build + tests."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          # The backend RSpec suite includes the OpenAPI conformance gate, which
          # reads docs/api/openapi.yaml — so a contract change must re-run it too.
          if echo "$changed" | grep -Eq '^backend/|^docs/api/'; then
            echo "backend changes detected → running backend pipeline."
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend changes → skipping backend pipeline."
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          # The OpenAPI contract harness (lint + TS codegen drift) runs only on
          # docs/api/** changes (ADR-0017).
          if echo "$changed" | grep -Eq '^docs/api/'; then
            echo "API contract changes detected → running OpenAPI harness."
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "No API contract changes → skipping OpenAPI harness."
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

          # The web SPA (ADR-0018) consumes the generated contract types, so the
          # web lane runs on webapp/** changes AND docs/api/** changes (a contract
          # change can break the typed client). Editing this CI file alone does not.
          if echo "$changed" | grep -Eq '^webapp/|^docs/api/'; then
            echo "web changes detected → running web lane."
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "No web changes → skipping web lane."
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  # 1. Type-check + build. In Swift, compilation IS the type check, so this one
  #    job covers both. build-for-testing also compiles the unit + UI test
  #    targets, then we tar the products (preserving the +x bit, which
  #    upload-artifact's zip would drop) for the test jobs to reuse.
  build:
    name: build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-26
    timeout-minutes: 30
    # iOS app and its project.yml live under ios/ (ADR-0016 monorepo); run all
    # build steps from there so `xcodegen generate` writes ios/MoneyLover.xcodeproj.
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select newest Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          XCODE="${XCODE:-/Applications/Xcode.app}"
          echo "Using $XCODE"
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version

      # MoneyLover.xcodeproj is generated from project.yml by XcodeGen
      # (gitignored, not committed). Regenerate before building.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # -quiet drops the per-file compile commands; warnings + errors still
      # print, and a non-zero exit still fails the step. This compiles
      # everything and emits the Full-plan .xctestrun manifest.
      - name: Build for testing (Full plan)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -testPlan Full \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
          echo "✅ Build succeeded"

      # The test bundles are identical across plans — only the selection differs.
      # Re-running build-for-testing for the Smoke plan is incremental (no
      # recompile) and just writes the Smoke .xctestrun alongside Full, so the
      # smoke (PR) and full (nightly) test jobs both reuse this single build.
      - name: Emit Smoke plan manifest
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -testPlan Smoke \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
          ls DerivedData/Build/Products/*.xctestrun

      # tar preserves the executable bit + bundle layout; the .xctestrun uses
      # __TESTROOT__-relative paths, so the absolute workspace path is irrelevant
      # when the test jobs run test-without-building.
      - name: Package build products
        run: tar -czf "$GITHUB_WORKSPACE/build-products.tar.gz" -C DerivedData/Build Products

      - name: Upload build products
        uses: actions/upload-artifact@v7
        with:
          name: build-products
          path: build-products.tar.gz
          retention-days: 1

  # 2. Unit tests (Swift Testing) — reuse the compiled products, no rebuild.
  unit-tests:
    name: unit-tests
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Select newest Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          XCODE="${XCODE:-/Applications/Xcode.app}"
          sudo xcode-select -switch "$XCODE"

      - name: Download build products
        uses: actions/download-artifact@v8
        with:
          name: build-products

      - name: Unpack build products
        run: |
          mkdir -p DerivedData/Build
          tar -xzf build-products.tar.gz -C DerivedData/Build

      - name: Run unit tests
        run: |
          set -o pipefail
          XCTESTRUN="$(ls DerivedData/Build/Products/*Full*.xctestrun | head -n1)"
          echo "Using $XCTESTRUN"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "$DESTINATION" \
            -only-testing:MoneyLoverTests \
            -resultBundlePath UnitTestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload unit test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: UnitTestResults
          path: UnitTestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # 3. UI smoke tests (XCUITest, Smoke plan) — the curated PR gate. Reuses the
  #    compiled products, no rebuild, and runs in parallel with unit tests. The
  #    full UI suite runs nightly (nightly.yml), not here. See ADR-0011.
  #    Smoke exec is ~2.5 min today; timeout-minutes is a backstop against the
  #    suite creeping past the 5-min budget (sim boot + exec).
  ui-smoke:
    name: ui-smoke
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - name: Select newest Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          XCODE="${XCODE:-/Applications/Xcode.app}"
          sudo xcode-select -switch "$XCODE"

      - name: Download build products
        uses: actions/download-artifact@v8
        with:
          name: build-products

      - name: Unpack build products
        run: |
          mkdir -p DerivedData/Build
          tar -xzf build-products.tar.gz -C DerivedData/Build

      # Parallel testing clones the simulator into N workers and shards the test
      # cases across them, cutting wall-clock ~Nx. Safe here because every UI
      # test launches its own app backed by an in-memory SwiftData store
      # (RootView.swift: inMemory: true) — no shared on-disk state to race on.
      # Worker count is capped to the runner's core count; 3 fits the macOS
      # runner comfortably and divides the 10-case smoke set well.
      - name: Run UI smoke tests
        run: |
          set -o pipefail
          XCTESTRUN="$(ls DerivedData/Build/Products/*Smoke*.xctestrun | head -n1)"
          echo "Using $XCTESTRUN"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "$DESTINATION" \
            -only-testing:MoneyLoverUITests \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count 3 \
            -resultBundlePath UISmokeResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload UI smoke results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: UISmokeResults
          path: UISmokeResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # 4. Backend (Rails API) — runs only on backend/** changes (ADR-0016 path
  #    filter). Spins up Postgres + Redis service containers and runs RSpec.
  #    Skipped (→ counts as pass) when a PR touches no backend files.
  backend:
    name: backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:prepare

      - name: Run RSpec
        run: bundle exec rspec

  # 5. OpenAPI contract harness (ADR-0017) — runs only on docs/api/** changes.
  #    Lints the hand-maintained contract against the OpenAPI 3.x meta-schema and
  #    fails if the committed TypeScript types have drifted from the YAML.
  #    Skipped (→ counts as pass) when a PR touches no contract files.
  openapi:
    name: openapi
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/api/package-lock.json

      - name: Install contract tooling
        run: npm ci

      - name: Lint OpenAPI document
        run: npm run lint

      - name: Verify generated TS types are up to date
        run: npm run check

  # 6. Web SPA (ADR-0018) — runs only on webapp/** or docs/api/** changes
  #    (ADR-0016 path filter; the typed client depends on the generated contract
  #    types). Skipped (→ counts as pass) when a PR touches no web/contract files.
  #    Full web gate: typecheck, lint, i18n parity + no-hard-coded-copy, unit
  #    tests, and a production build.
  web:
    name: web
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: i18n check (no hard-coded copy; en/vi key parity)
        run: npm run check:i18n

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Install only the Chromium browser (+ OS deps) the e2e project needs.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Hermetic e2e: the spec mocks the Rails API at the network layer
      # (page.route), so no live backend is needed. Playwright boots the Vite
      # dev server itself (see playwright.config.ts webServer).
      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: webapp/playwright-report
          if-no-files-found: ignore
          retention-days: 7
