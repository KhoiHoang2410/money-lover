name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN for all jobs: this workflow only checks out
# code and uploads/downloads artifacts (artifact actions need no extra scope).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: MoneyLover
  PROJECT: MoneyLover.xcodeproj
  # iPhone 17 on the latest installed iOS runtime (see README.md).
  DESTINATION: "platform=iOS Simulator,name=iPhone 17,OS=latest"

jobs:
  # 0. Detect whether this push/PR touches anything that ships in (or builds)
  #    the app. If only docs / .claude skills / repo config changed, the binary
  #    is byte-for-byte identical, so build + tests are skipped below.
  #
  #    IMPORTANT — why skip at the *job* level (if:) and not via `on: paths`:
  #    build/unit-tests/ui-smoke are *required* status checks (main ruleset).
  #    A `paths-ignore` filter would make the whole workflow not run, leaving
  #    those required checks "Expected — waiting" forever and wedging the PR.
  #    A job skipped by an `if:` condition instead reports a "skipped"
  #    conclusion, which GitHub counts as a *pass* for required checks. So the
  #    workflow always triggers; this cheap Ubuntu job decides the rest.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect app / test code changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Pick the diff base. PR: the base branch tip. Push: the previous tip.
          # Manual dispatch / first push (all-zero before): no base → run everything.
          if [ "$EVENT" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ "$EVENT" = "push" ] && [ "${BEFORE_SHA:-}" != "0000000000000000000000000000000000000000" ]; then
            base="${BEFORE_SHA:-}"
          else
            base=""
          fi

          if [ -z "$base" ]; then
            echo "No diff base (manual/initial run) — running full CI."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"
          echo "$changed"

          # Paths that affect the shipped/built app: the three source+test
          # folders, plus project.yml (XcodeGen build definition — changing it
          # can alter the build without touching a source file). Editing this CI
          # file itself does NOT trigger a run.
          if echo "$changed" | grep -Eq '^(MoneyLover/|MoneyLoverTests/|MoneyLoverUITests/|project\.yml$)'; then
            echo "Build/test-affecting changes detected → running CI."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "No build/test-affecting changes → skipping build + tests."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # 1. Type-check + build. In Swift, compilation IS the type check, so this one
  #    job covers both. build-for-testing also compiles the unit + UI test
  #    targets, then we tar the products (preserving the +x bit, which
  #    upload-artifact's zip would drop) for the test jobs to reuse.
  build:
    name: build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select newest Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          XCODE="${XCODE:-/Applications/Xcode.app}"
          echo "Using $XCODE"
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version

      # MoneyLover.xcodeproj is generated from project.yml by XcodeGen
      # (gitignored, not committed). Regenerate before building.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # -quiet drops the per-file compile commands; warnings + errors still
      # print, and a non-zero exit still fails the step. This compiles
      # everything and emits the Full-plan .xctestrun manifest.
      - name: Build for testing (Full plan)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -testPlan Full \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
          echo "✅ Build succeeded"

      # The test bundles are identical across plans — only the selection differs.
      # Re-running build-for-testing for the Smoke plan is incremental (no
      # recompile) and just writes the Smoke .xctestrun alongside Full, so the
      # smoke (PR) and full (nightly) test jobs both reuse this single build.
      - name: Emit Smoke plan manifest
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -testPlan Smoke \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
          ls DerivedData/Build/Products/*.xctestrun

      # tar preserves the executable bit + bundle layout; the .xctestrun uses
      # __TESTROOT__-relative paths, so the absolute workspace path is irrelevant
      # when the test jobs run test-without-building.
      - name: Package build products
        run: tar -czf build-products.tar.gz -C DerivedData/Build Products

      - name: Upload build products
        uses: actions/upload-artifact@v7
        with:
          name: build-products
          path: build-products.tar.gz
          retention-days: 1

  # 2. Unit tests (Swift Testing) — reuse the compiled products, no rebuild.
  unit-tests:
    name: unit-tests
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Select newest Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          XCODE="${XCODE:-/Applications/Xcode.app}"
          sudo xcode-select -switch "$XCODE"

      - name: Download build products
        uses: actions/download-artifact@v8
        with:
          name: build-products

      - name: Unpack build products
        run: |
          mkdir -p DerivedData/Build
          tar -xzf build-products.tar.gz -C DerivedData/Build

      - name: Run unit tests
        run: |
          set -o pipefail
          XCTESTRUN="$(ls DerivedData/Build/Products/*Full*.xctestrun | head -n1)"
          echo "Using $XCTESTRUN"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "$DESTINATION" \
            -only-testing:MoneyLoverTests \
            -resultBundlePath UnitTestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload unit test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: UnitTestResults
          path: UnitTestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # 3. UI smoke tests (XCUITest, Smoke plan) — the curated PR gate. Reuses the
  #    compiled products, no rebuild, and runs in parallel with unit tests. The
  #    full UI suite runs nightly (nightly.yml), not here. See ADR-0011.
  #    Smoke exec is ~2.5 min today; timeout-minutes is a backstop against the
  #    suite creeping past the 5-min budget (sim boot + exec).
  ui-smoke:
    name: ui-smoke
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - name: Select newest Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          XCODE="${XCODE:-/Applications/Xcode.app}"
          sudo xcode-select -switch "$XCODE"

      - name: Download build products
        uses: actions/download-artifact@v8
        with:
          name: build-products

      - name: Unpack build products
        run: |
          mkdir -p DerivedData/Build
          tar -xzf build-products.tar.gz -C DerivedData/Build

      # Parallel testing clones the simulator into N workers and shards the test
      # cases across them, cutting wall-clock ~Nx. Safe here because every UI
      # test launches its own app backed by an in-memory SwiftData store
      # (RootView.swift: inMemory: true) — no shared on-disk state to race on.
      # Worker count is capped to the runner's core count; 3 fits the macOS
      # runner comfortably and divides the 10-case smoke set well.
      - name: Run UI smoke tests
        run: |
          set -o pipefail
          XCTESTRUN="$(ls DerivedData/Build/Products/*Smoke*.xctestrun | head -n1)"
          echo "Using $XCTESTRUN"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "$DESTINATION" \
            -only-testing:MoneyLoverUITests \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count 3 \
            -resultBundlePath UISmokeResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload UI smoke results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: UISmokeResults
          path: UISmokeResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
